<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Console — Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%2314171b'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%232bb3a0'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#14171b; --surface:#1b1f24; --raised:#22272d; --hairline:#2c333a;
    --teal:#2bb3a0; --teal-dim:#1f8577; --orange:#e2793d;
    --text-hi:#ecedf0; --text-mid:#98a1ab; --text-low:#5f6870;
    --critical:#dd5f55;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--ink); color:var(--text-hi); font-family:var(--sans);
    display:flex; align-items:center; justify-content:center; padding:1.5rem;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 60% 45% at 50% 0%, rgba(43,179,160,0.07), transparent);
  }
  .card{
    width:100%; max-width:360px; background:var(--surface);
    border:1px solid var(--hairline); border-radius:12px; padding:2.25rem 2rem;
    position:relative;
  }
  .brand{
    font-family:var(--mono); font-size:0.72rem; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--text-low); margin-bottom:0.35rem;
  }
  .brand b{ color:var(--teal); display:block; font-size:1.05rem; letter-spacing:0.08em; margin-bottom:0.3rem;}
  h1{ font-size:1.05rem; font-weight:600; margin:1.5rem 0 0.4rem; }
  p.sub{ color:var(--text-mid); font-size:0.85rem; margin:0 0 1.5rem; }
  label{
    display:block; font-family:var(--mono); font-size:0.68rem; text-transform:uppercase;
    letter-spacing:0.09em; color:var(--text-low); margin-bottom:0.45rem;
  }
  input[type=password]{
    width:100%; background:var(--raised); border:1px solid var(--hairline);
    border-radius:8px; color:var(--text-hi); font-size:0.95rem;
    padding:0.65rem 0.85rem; font-family:var(--mono);
  }
  input[type=password]:focus{ outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal-dim); }
  button{
    width:100%; margin-top:1.1rem; background:var(--teal-dim); border:none;
    color:#fff; font-family:var(--mono); font-size:0.82rem; letter-spacing:0.08em;
    text-transform:uppercase; padding:0.7rem; border-radius:8px; cursor:pointer;
    transition:background .15s ease;
  }
  button:hover{ background:var(--teal); }
  button:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .error{
    display:none; margin-top:0.9rem; font-size:0.83rem; color:var(--critical);
    background:rgba(221,95,85,0.1); border:1px solid rgba(221,95,85,0.3);
    border-radius:8px; padding:0.55rem 0.8rem;
  }
  .error.show{ display:block; }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:0.001ms !important;} }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="brand"><b>Studio Console</b>editor tracker · agency ops</div>
    <h1>Sign in</h1>
    <p class="sub">Enter the admin password to open the dashboard.</p>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus required>
    <button type="submit">Enter console</button>
    <div class="error" id="err">Wrong password — try again.</div>
  </form>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.classList.remove('show');
  const res = await fetch('/api/console/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: document.getElementById('pw').value}),
  });
  if (res.ok) { location.href = '/'; }
  else { err.classList.add('show'); document.getElementById('pw').select(); }
});
</script>
</body>
</html>
